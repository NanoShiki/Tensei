<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>洛恩俯视动作预览</title><style>body{font:16px system-ui;background:#ece9e2;color:#223;padding:28px}canvas{background:#788b74;border:1px solid #555}button,select,input{margin:8px;padding:8px}p{max-width:800px}</style><h1>洛恩 · 俯视动作预览</h1><p>固定规格：1024×1024，4×4 网格，每格 256×256。当前为动作样张，循环相位与角色比例仍需评审。</p><select id="action"><option value="../../../../Assets/Characters/Lorn/07-俯视行走.png">行走</option><option value="../../../../Assets/Characters/Lorn/08-俯视跑步.png">跑步</option></select><select id="dir"><option>南</option><option>东</option><option>北</option><option>西</option></select><button id="play">暂停</button><button id="step">下一帧</button><label>背景<input id="bg" type="color" value="#788b74"></label><p id="info"></p><canvas id="c" width="512" height="512"></canvas><script>const image=new Image(),c=document.querySelector('#c'),ctx=c.getContext('2d'),action=document.querySelector('#action'),dir=document.querySelector('#dir'),info=document.querySelector('#info');let frame=0,play=true,ready=false,last=0;function draw(){if(!ready)return;ctx.clearRect(0,0,512,512);ctx.drawImage(image,frame*256,dir.selectedIndex*256,256,256,0,0,512,512);ctx.strokeStyle='#d5c989';ctx.beginPath();ctx.moveTo(248,448);ctx.lineTo(264,448);ctx.moveTo(256,440);ctx.lineTo(256,456);ctx.stroke();info.textContent=`${dir.value} 第 ${frame+1}/4 帧 · 画布 ${image.width}×${image.height} · 黄色十字为地面锚点`;}function load(){ready=false;frame=0;image.src=action.value;}image.onload=()=>{if(image.width!==1024||image.height!==1024){info.textContent='尺寸错误';return;}ready=true;draw()};image.onerror=()=>info.textContent='读取失败';action.onchange=load;dir.onchange=draw;document.querySelector('#bg').oninput=e=>c.style.background=e.target.value;document.querySelector('#play').onclick=e=>{play=!play;e.target.textContent=play?'暂停':'播放'};document.querySelector('#step').onclick=()=>{play=false;document.querySelector('#play').textContent='播放';frame=(frame+1)%4;draw()};function tick(t){const fps=action.selectedIndex===0?6:8;if(play&&t-last>1000/fps){frame=(frame+1)%4;draw();last=t;}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);</script></html>
